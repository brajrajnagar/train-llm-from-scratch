# 160M parameter model -- the sweet spot for this project
# Trains in ~4 hours on 3x B200 (~657K tokens/sec), ~24-48 hours on a single A100/4090
# Large enough to be a passable chatbot, small enough to iterate on

model:
  d_model: 768
  n_heads: 12
  n_kv_heads: 4
  n_blocks: 20
  d_ff: 2048            # ~8/3 * 768, rounded
  vocab_size: 50257
  seq_length: 1024
  dropout: 0.0
  rope_theta: 10000.0

training:
  max_steps: 50000       # ~9.9B tokens at ~197K tokens/step
  batch_size: 64         # Per-GPU (B200 178GB fits 128, leave headroom for FSDP)
  grad_accum_steps: 1    # No accumulation needed -- large per-GPU batch
  learning_rate: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

data:
  train_path: data/train.bin
  val_path: data/val.bin

checkpoint_dir: data/checkpoints/pretrain
save_interval: 2000
eval_interval: 500
eval_iters: 100
log_interval: 10

compile: false
gradient_checkpointing: false    # Enable if OOM on smaller GPUs
