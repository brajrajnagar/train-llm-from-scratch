# 400M parameter model -- for users with more compute
# Trains in ~24-48 hours on 3x B200
# Noticeably better quality than 160M

model:
  d_model: 1024
  n_heads: 16
  n_kv_heads: 8
  n_blocks: 30
  d_ff: 2816            # ~8/3 * 1024, rounded to multiple of 256
  vocab_size: 50257
  seq_length: 2048
  dropout: 0.0
  rope_theta: 10000.0

training:
  max_steps: 100000
  batch_size: 4
  grad_accum_steps: 8    # Effective batch = 4 * 3 * 8 = 96 seqs = ~196K tokens
  learning_rate: 3.0e-4
  min_lr: 3.0e-5
  warmup_steps: 2000
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

data:
  train_path: data/train.bin
  val_path: data/val.bin

checkpoint_dir: data/checkpoints/pretrain
save_interval: 2000
eval_interval: 500
eval_iters: 100
log_interval: 10

compile: true
gradient_checkpointing: true     # Recommended at 400M
